<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Προσκλητήριο Γάμου</title>
<meta name="description" content="Ψηφιακό προσκλητήριο γάμου">
<meta property="og:title" content="Προσκλητήριο Γάμου">
<meta property="og:description" content="Ανοίξτε τον φάκελο ✉">
<meta property="og:type" content="website">
<meta name="theme-color" content="#e9e0ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23c79bb4' stroke='%23efe0c2' stroke-width='3'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23fff' font-family='serif'%3E%26%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Parisienne&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="pause-on-leave.js"></script>
</head>
<body>
<!-- shared SVG gradients (mirror frame) -->
<svg class="defs" aria-hidden="true" focusable="false" id="defs"></svg>

<!-- soft, blurred copy of the current slide behind everything -->
<div class="backdrop" id="backdrop" aria-hidden="true"><div class="bd"></div><div class="bd"></div></div>
<canvas class="petals" id="petals" aria-hidden="true"></canvas>

<main class="scene" id="scene">
  <div class="env-wrap" id="envWrap">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Άνοιγμα φακέλου">
      <div class="layer back"></div>
      <div class="card-slot" id="slot">
        <article class="card dormant" id="card"></article>
      </div>
      <img class="layer pocket" src="img/env-pocket.webp" alt="" draggable="false">
      <div class="flap" id="flap">
        <img class="face" src="img/env-flap.webp" alt="" draggable="false">
        <img class="face inside" src="img/env-flap-in.webp" alt="" draggable="false">
      </div>
      <img class="seal" id="seal" src="img/env-seal.webp" alt="" draggable="false">
    </div>
  </div>
  <p class="hint" id="hint"></p>
</main>

<div class="card-stage" id="cardStage"></div>
<div class="progress" id="progress" hidden></div>

<button class="chip close" id="closeBtn" type="button" hidden></button>
<button class="chip music" id="musicBtn" type="button" hidden aria-label="Μουσική">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="mute-x" d="M3 3l18 18" stroke="currentColor" stroke-width="1.8"/></svg>
</button>

<script src="app.js"></script>
</body>
</html>
